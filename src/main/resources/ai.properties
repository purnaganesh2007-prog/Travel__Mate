# TravelMate AI model defaults.
#
# Any OpenAI-compatible "chat completions" API works: OpenRouter, OpenAI, Groq,
# Google Gemini (OpenAI endpoint), Together, a lab's experimental endpoint,
# or a local Ollama / LM Studio server.
#
# These are only DEFAULTS. Values saved on the "AI Settings" page (settings.html)
# are stored in the database and take priority. Environment variables
# TM_AI_BASE_URL / TM_AI_API_KEY / TM_AI_MODEL override this file too.
#
# Examples of base URLs:
#   OpenRouter   https://openrouter.ai/api/v1
#   OpenAI       https://api.openai.com/v1
#   Groq         https://api.groq.com/openai/v1
#   Gemini       https://generativelanguage.googleapis.com/v1beta/openai
#   Ollama       http://localhost:11434/v1
#   LM Studio    http://localhost:1234/v1

# WHO MAY OPEN "AI Settings" (change the model / API key): sign-in emails of you and your friends,
# separated by commas. Everyone else never sees the link and the server refuses them (403).
# CHANGE THESE to the emails you and your friends register with. Environment variable
# TM_AI_ALLOWED_EMAILS overrides this line. With an empty list nobody can open AI Settings.
ai.allowedEmails=purnaganeshtavva@gmail.com, friend1@example.com, friend2@example.com

ai.enabled=false
ai.baseUrl=https://openrouter.ai/api/v1
ai.apiKey=
ai.model=
ai.temperature=0.7
ai.maxTokens=4000
ai.timeoutSeconds=90
# Hidden "thinking" of reasoning models: none, minimal, low, medium, high, or default (provider decides).
# "none" is by far the fastest and keeps the output limit for the itinerary itself. Models that cannot
# switch reasoning off are retried with "low" automatically. Environment variable: TM_AI_REASONING_EFFORT.
ai.reasoningEffort=none
# Send response_format={"type":"json_object"}. Turn off if your model/provider rejects it.
ai.jsonMode=false
# Extra HTTP headers, one per line as "Name: value" (use \n between lines here).
# OpenRouter optionally uses HTTP-Referer and X-Title to show your app name.
ai.extraHeaders=X-Title: TravelMate
